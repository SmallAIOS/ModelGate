[package]
name = "smctl-mcp"
description = "MCP server surface for smctl (stdio transport, vertical slice)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rmcp = { version = "1.5", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"

smctl-log = { path = "../smctl-log" }
smctl-workspace = { path = "../smctl-workspace" }
smctl-flow = { path = "../smctl-flow" }
smctl-spec = { path = "../smctl-spec" }
smctl-build = { path = "../smctl-build" }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
rmcp = { version = "1.5", features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-async-rw",
    "transport-streamable-http-server",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "schemars",
] }
anyhow.workspace = true
tokio = { workspace = true }
assert_cmd.workspace = true
predicates.workspace = true
