<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-0);}
  .card{padding:20px 24px;display:flex;gap:20px;align-items:center;}
  .logo{display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 20px;border:1px solid var(--fg-3);border-radius:6px;background:var(--bg-1);color:var(--fg-0);}
  .logo svg{width:36px;height:36px;}
  .logo.dark{background:#0B0C0E;color:#F3F4F6;border-color:#2E3139;}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);letter-spacing:0.08em;text-transform:uppercase;}
  .logo.dark .cap{color:#8A8F99;}
</style></head>
<body class="ds-root"><div class="card">
  <div class="logo">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
      <rect x="4" y="4" width="40" height="40" rx="3"/>
      <path d="M14 14 H34 M14 24 H24 M24 24 V34 H34"/>
      <circle cx="14" cy="14" r="1.5" fill="currentColor" stroke="none"/><circle cx="34" cy="14" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="14" cy="24" r="1.5" fill="currentColor" stroke="none"/><circle cx="24" cy="24" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="24" cy="34" r="1.5" fill="currentColor" stroke="none"/><circle cx="34" cy="34" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    <span class="cap">mark · light</span>
  </div>
  <div class="logo dark">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
      <rect x="4" y="4" width="40" height="40" rx="3"/>
      <path d="M14 14 H34 M14 24 H24 M24 24 V34 H34"/>
      <circle cx="14" cy="14" r="1.5" fill="currentColor" stroke="none"/><circle cx="34" cy="14" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="14" cy="24" r="1.5" fill="currentColor" stroke="none"/><circle cx="24" cy="24" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="24" cy="34" r="1.5" fill="currentColor" stroke="none"/><circle cx="34" cy="34" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    <span class="cap">mark · dark</span>
  </div>
  <div class="logo" style="flex-direction:row;gap:10px;padding:10px 18px;">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="width:28px;height:28px;">
      <rect x="4" y="4" width="40" height="40" rx="3"/>
      <path d="M14 14 H34 M14 24 H24 M24 24 V34 H34"/>
    </svg>
    <div style="display:flex;flex-direction:column;"><span style="font-family:var(--font-sans);font-size:18px;font-weight:600;letter-spacing:-0.01em;">SmallAIOS</span><span class="cap" style="margin-top:-2px">ModelGate / smctl</span></div>
  </div>
</div></body></html>
