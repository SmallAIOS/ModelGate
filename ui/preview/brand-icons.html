<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-0);}
  .card{padding:20px 24px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;color:var(--fg-0);}
  .ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;}
  .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .ic span{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
</style></head>
<body class="ds-root"><div class="card">
  <div class="ic"><svg viewBox="0 0 24 24"><polyline points="4,17 10,11 4,5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><span>terminal</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7a3 3 0 0 0 3 3h6.5"/></svg><span>git-branch</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 7l9-5 9 5-9 5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg><span>package</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg><span>cpu</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg><span>shield-ok</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>activity</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span>pause</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg><span>play</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg><span>check</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg><span>x</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>dot</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="7" cy="7" r="0.5" fill="currentColor"/></svg><span>hard-drive</span></div>
</div></body></html>
