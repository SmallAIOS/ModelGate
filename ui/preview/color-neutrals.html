<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-0);}
  .card{box-sizing:border-box;padding:20px 24px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .sw{border:1px solid var(--fg-3);border-radius:4px;overflow:hidden;background:var(--bg-1);}
  .chip{height:56px;}
  .meta{padding:8px 10px;font-family:var(--font-mono);font-size:11px;color:var(--fg-1);display:flex;justify-content:space-between;}
  .name{font-weight:500;color:var(--fg-0);}
  .hex{color:var(--fg-2);}
</style></head>
<body class="ds-root"><div class="card">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#F7F7F5"></div><div class="meta"><span class="name">bg-0</span><span class="hex">F7F7F5</span></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><span class="name">bg-1</span><span class="hex">FFFFFF</span></div></div>
    <div class="sw"><div class="chip" style="background:#EFEFEC"></div><div class="meta"><span class="name">bg-2</span><span class="hex">EFEFEC</span></div></div>
    <div class="sw"><div class="chip" style="background:#E4E4DF"></div><div class="meta"><span class="name">bg-3</span><span class="hex">E4E4DF</span></div></div>
    <div class="sw"><div class="chip" style="background:#0B0C0E"></div><div class="meta"><span class="name">fg-0</span><span class="hex">0B0C0E</span></div></div>
    <div class="sw"><div class="chip" style="background:#2A2D33"></div><div class="meta"><span class="name">fg-1</span><span class="hex">2A2D33</span></div></div>
    <div class="sw"><div class="chip" style="background:#6A6E78"></div><div class="meta"><span class="name">fg-2</span><span class="hex">6A6E78</span></div></div>
    <div class="sw"><div class="chip" style="background:#C7C9CE"></div><div class="meta"><span class="name">fg-3</span><span class="hex">C7C9CE</span></div></div>
  </div>
</div></body></html>
