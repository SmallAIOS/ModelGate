<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-0);}
  .card{box-sizing:border-box;padding:20px 24px;font-family:var(--font-sans);color:var(--fg-0);}
  .row{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--fg-4);}
  .row:last-child{border-bottom:none;}
  .label{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);letter-spacing:0.05em;text-transform:uppercase;width:88px;flex-shrink:0;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-left:auto;}
</style></head>
<body class="ds-root"><div class="card">
  <div class="row"><span class="label">Display</span><span style="font-family:var(--font-sans);font-size:40px;font-weight:600;letter-spacing:-0.01em;line-height:1.1;">Boot to ONNX.</span><span class="meta">Plex Sans 40/48 · 600</span></div>
  <div class="row"><span class="label">H1</span><span style="font-family:var(--font-sans);font-size:28px;font-weight:600;line-height:1.2;">Workspace status</span><span class="meta">28/34 · 600</span></div>
  <div class="row"><span class="label">H2</span><span style="font-family:var(--font-sans);font-size:20px;font-weight:600;">Active feature branches</span><span class="meta">20/26 · 600</span></div>
  <div class="row"><span class="label">H3</span><span style="font-family:var(--font-sans);font-size:16px;font-weight:600;">SmallAIOS · develop</span><span class="meta">16/22 · 600</span></div>
</div></body></html>
