<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-0);}
  .card{padding:20px 24px;}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .box{background:#3451FF;height:20px;border-radius:2px;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);width:60px;}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--fg-1);margin-left:auto;}
</style></head>
<body class="ds-root"><div class="card">
  <div class="row"><span class="tag">space-1</span><div class="box" style="width:4px"></div><span class="v">4px · --space-1</span></div>
  <div class="row"><span class="tag">space-2</span><div class="box" style="width:8px"></div><span class="v">8px · --space-2 · base unit</span></div>
  <div class="row"><span class="tag">space-3</span><div class="box" style="width:12px"></div><span class="v">12px · dense table cell</span></div>
  <div class="row"><span class="tag">space-4</span><div class="box" style="width:16px"></div><span class="v">16px · card padding Y</span></div>
  <div class="row"><span class="tag">space-5</span><div class="box" style="width:24px"></div><span class="v">24px · card padding X</span></div>
  <div class="row"><span class="tag">space-6</span><div class="box" style="width:32px"></div><span class="v">32px · section rhythm</span></div>
  <div class="row"><span class="tag">space-7</span><div class="box" style="width:48px"></div><span class="v">48px · major section</span></div>
  <div class="row"><span class="tag">space-8</span><div class="box" style="width:64px"></div><span class="v">64px · top chrome</span></div>
</div></body></html>
