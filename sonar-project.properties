# SonarCloud configuration. Validate by running the workflow once
# and watching the project page at https://sonarcloud.io.

sonar.projectKey=SmallAIOS_ModelGate
sonar.organization=smallaios
sonar.host.url=https://sonarcloud.io

sonar.projectName=ModelGate
sonar.projectVersion=0.1.0

# Source roots — every Rust crate plus the React SPA src tree.
sonar.sources=smctl,smctl-workspace,smctl-flow,smctl-spec,smctl-build,smctl-log,smctl-mcp,smctl-quality,smctl-gate,modelgate-web,ui/modelgate-web/src

# Test roots — kept separate so Sonar doesn't penalise test files in
# duplication / coverage metrics.
sonar.tests=smctl-gate/tests,modelgate-web/tests,smctl-workspace/tests,ui/modelgate-web/src/api.test.ts

# Coverage report paths. The CI workflow downloads these as artifacts
# from the test / frontend jobs before invoking the scanner.
sonar.javascript.lcov.reportPaths=ui/modelgate-web/coverage/lcov.info
sonar.community.coverage.reportPaths=coverage-rust.info

# Don't analyse generated / vendored / non-source assets.
sonar.exclusions=\
  target/**,\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  ui/ui_kits/**,\
  openspec/**,\
  ui/preview/**,\
  ui/assets/**

# Don't double-count tests in code-smell metrics.
sonar.test.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/tests/**

# Don't run copy-paste detection on test code or on Cargo lockfiles.
# Test boilerplate (assert_cmd builders, repeated wiremock setups,
# fixture-write blocks) legitimately repeats by design and skews the
# duplication metric.
sonar.cpd.exclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/Cargo.lock

sonar.sourceEncoding=UTF-8
