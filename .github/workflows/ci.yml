name: ModelGate CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # Opt into Node 24 for JS-based actions (checkout, setup-node,
  # upload-artifact, download-artifact). @v5 of upload/download-artifact
  # still bundles Node 20 internally; this opts us onto the runner's
  # Node 24 ahead of GitHub's June 2 2026 forced cutover, which
  # silences the deprecation annotations.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/modelgate-web/package-lock.json
      - name: Install
        working-directory: ui/modelgate-web
        run: npm ci
      - name: Typecheck
        working-directory: ui/modelgate-web
        run: npm run typecheck
      - name: Test with coverage
        working-directory: ui/modelgate-web
        run: npm run coverage
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ui/modelgate-web/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Stash frontend coverage for Sonar
        uses: actions/upload-artifact@v5
        with:
          name: modelgate-web-coverage
          path: ui/modelgate-web/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error
      - name: Build
        working-directory: ui/modelgate-web
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
          retention-days: 1
          if-no-files-found: error

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path coverage-rust.info
      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-rust.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Stash Rust coverage for Sonar
        uses: actions/upload-artifact@v5
        with:
          name: modelgate-rust-coverage
          path: coverage-rust.info
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
      - run: cargo build --workspace --release

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [frontend, test]
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar uses git blame for new-code detection; needs full
          # history rather than the default shallow clone.
          fetch-depth: 0
      - name: Download Rust coverage
        uses: actions/download-artifact@v5
        with:
          name: modelgate-rust-coverage
          path: .
      - name: Download frontend coverage
        uses: actions/download-artifact@v5
        with:
          name: modelgate-web-coverage
          path: ui/modelgate-web/coverage
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [check-format, frontend, clippy, test, build, sonar]
    if: github.event_name == 'pull_request'
    steps:
      - name: All checks passed
        run: echo "All CI checks passed — PR is mergeable"
