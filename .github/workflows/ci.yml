name: ModelGate CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # Opt into Node 24 for JS-based actions (checkout, setup-node,
  # upload-artifact, download-artifact). @v5 of upload/download-artifact
  # still bundles Node 20 internally; this opts us onto the runner's
  # Node 24 ahead of GitHub's June 2 2026 forced cutover, which
  # silences the deprecation annotations.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/modelgate-web/package-lock.json
      - name: Install
        working-directory: ui/modelgate-web
        run: npm ci
      - name: Typecheck
        working-directory: ui/modelgate-web
        run: npm run typecheck
      - name: Test
        working-directory: ui/modelgate-web
        run: npm test
      - name: Build
        working-directory: ui/modelgate-web
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
          retention-days: 1
          if-no-files-found: error

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
      - run: cargo test --workspace

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: modelgate-web-dist
          path: ui/modelgate-web/dist
      - run: cargo build --workspace --release

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [check-format, frontend, clippy, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - name: All checks passed
        run: echo "All CI checks passed — PR is mergeable"
